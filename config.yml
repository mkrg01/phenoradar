data:
  metadata_path: c4_dataset/species_metadata.tsv
  tpm_path: c4_dataset/tpm.tsv  # TSV or gzip-compressed TSV (.tsv.gz)
  tree_path: c4_dataset/ncbi_tree.nwk  # type: string or null
  orthogroup_annotation_path: c4_dataset/odb12v2_OGs.tab.gz  # type: string or null
  species_col: species
  feature_col: orthogroup
  value_col: tpm
  trait_col: C4
  contrast_pair_col: contrast_pair_id  # type: string or null

  # Optional amino-acid inputs.
  feature_mode: expression  # choices: expression, amino_acid, combined
  alignment_dir: null  # type: string or null
  sequence_tpm_path: null  # type: string or null; species/sequence_id/tpm TSV[.gz]

split:
  group_col: contrast_pair_id
  exclude_col: null  # type: string or null
  require_both_labels_per_group: false  # choices: true, false
  outer_cv_strategy: logo  # choices: logo, group_kfold, stratified_group_kfold
  outer_cv_n_splits: null  # type: integer or null

sampling:
  strategy: all_samples  # choices: all_samples, group_balanced
  max_samples_per_label_per_group: null  # type: integer or null
  sampled_set_count: 1
  training_group_count: null  # type: integer or null
  group_subsample_repeats: 1
  weighting: group_label_inverse  # choices: none, group_label_inverse

preprocess:
  expression:
    absent_feature_fill: nan  # choices: 0, nan; nan supports random_forest or neutral LR
    missing_expression:
      method: neutral  # choices: none, neutral; neutral requires logistic_elasticnet/log1p/standard
      zero_as_missing: true  # choices: true, false; explicit TPM=0 is unknown; raw TPM is retained in evidence
    expression_transform:
      method: log1p  # choices: none, log1p, sample_rank, sample_percentile_rank
    sparse_feature_filter:
      enabled: true  # choices: true, false
      min_nonzero_fraction: 0.9  # type: number or null
      scope: all_samples  # choices: all_samples, any_trait, trait_0, trait_1
    low_variance_filter:
      enabled: false  # choices: true, false
      min_variance: null  # type: number or null
    ranked_feature_filter:
      method: none  # choices: none, pair_aware, unpaired, variance
      max_features: null  # type: integer or null
      min_contrast_pairs: 1
      higher_in_trait: null  # choices: 0, 1, null; null keeps either direction
    correlation_filter:
      enabled: false  # choices: true, false
      method: pearson  # choices: pearson, spearman
      max_abs_correlation: null  # type: number or null
    feature_scaling:
      method: standard  # choices: none, standard

  amino_acid:
    aggregation: tpm_weighted_frequency  # choices: best_covered, aa_frequency, tpm_weighted_frequency
    site_filter:
      min_sample_fraction: 0.8
      min_residue_states: 2
    ranked_site_filter:
      method: none  # choices: none, pair_aware, unpaired
      max_sites: 2000  # Used only for pair_aware or unpaired ranking
      min_contrast_pairs: 2
model:
  name: logistic_elasticnet  # choices: logistic_elasticnet, linear_svm, random_forest

model_selection:
  selected_candidate_count: 1  # type: integer or null
  selected_candidate_percent: null  # type: number or null
  candidate_source_policy: per_sample_set  # choices: per_sample_set, reuse_first_sample_set
  search_strategy: grid  # choices: grid, random, tpe
  trial_count: null  # type: integer or null
  search_space:
    lambda:
      type: log_range  # choices: range, int_range, log_range, continuous_range, continuous_log_range
      base: 10
      start_exp: -5
      end_exp: -1
      step_exp: 0.5
      inclusive_end: true  # choices: true, false
    alpha: [1]
    amino_acid_penalty_ratio: [0.1, 0.3, 1, 3, 10]  # Combined mode only; omitted means 1 (ordinary joint LASSO)
    maxit: [2000000]
    thresh: [1.0e-7]
  inner_cv_strategy: stratified_group_kfold  # choices: logo, group_kfold, stratified_group_kfold, null
  inner_cv_n_splits: 5  # type: integer or null
  selection_metric: log_loss  # choices: mcc, balanced_accuracy, log_loss
  selection_rule: best  # choices: best, one_se

abstention:
  enabled: true  # choices: true, false
  threshold: 0.8  # fixed observed coefficient fraction; not a probability threshold

ensemble:
  probability_aggregation: mean  # choices: mean, median

evaluation:
  group_bootstrap:
    enabled: true  # choices: true, false
    n_resamples: 2000
    confidence_level: 0.95

figures:
  top_features: 20

phylogenetic_imputation:
  enabled: false  # choices: true, false; unknown-species interpretation only
  branch_length_mode: input  # choices: input, unit
  model: ER  # choices: ER, ARD
  root_prior: equal  # choices: equal, empirical

summary:
  group_col: family

report: {}

runtime:
  seed: 42
  n_jobs: 32
  execution_stage: cv_only  # choices: cv_only, full_run
