name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  POLARS_MAX_THREADS: "1"

jobs:
  test:
    name: test / py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-py${{ matrix.python-version }}-
            uv-${{ runner.os }}-
      - name: Install dependencies
        run: uv sync --extra dev --frozen
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy src
      - name: Pytest
        run: uv run pytest -q
      - name: Build wheel for package-data smoke test
        if: matrix.python-version == '3.12'
        run: uv build --wheel
      - name: Smoke test dataset command from installed wheel
        if: matrix.python-version == '3.12'
        run: |
          uv venv --python "${{ matrix.python-version }}" "${RUNNER_TEMP}/phenoradar-wheel-smoke"
          uv pip install --python "${RUNNER_TEMP}/phenoradar-wheel-smoke/bin/python" dist/*.whl
          mkdir -p "${RUNNER_TEMP}/phenoradar-wheel-smoke-output"
          cd "${RUNNER_TEMP}/phenoradar-wheel-smoke-output"
          "${RUNNER_TEMP}/phenoradar-wheel-smoke/bin/python" - <<'PY'
          from importlib.metadata import version

          from phenoradar.provenance import phenoradar_build_snapshot

          snapshot = phenoradar_build_snapshot()
          assert snapshot["phenoradar_version"] == version("phenoradar")
          assert snapshot["phenoradar_install_type"] == "installed_distribution"
          assert snapshot["git_source"] == "unavailable"
          assert snapshot["git_commit"] == "unknown"
          PY
          "${RUNNER_TEMP}/phenoradar-wheel-smoke/bin/phenoradar" dataset --out c4_tiny
          test -f c4_tiny/species_metadata.tsv
          test -f c4_tiny/species_trait.tsv
          test -f c4_tiny/ncbi_tree.nwk
          test -f c4_tiny/tpm.tsv
